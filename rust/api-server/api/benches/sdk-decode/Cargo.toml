[workspace]

[package]
name = "sdk-decode"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
bytes = "1"
flate2 = { version = "1.1.11", features = ["zlib-rs"] }
game_module = { path = "../../../game_module" }
libc = "0.2"
spacetimedb-sdk = { git = "https://github.com/ResuBaka/SpacetimeDB", branch = "feature/no-client-cache-feature", default-features = false, features = ["streaming-decompression", "tokio-websockets-rustls"] }
