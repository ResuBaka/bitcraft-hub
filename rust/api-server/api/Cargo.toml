[package]
name = "api"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"

[features]
bench = []
tokio-worker-queues = []
spacetimedb-tokio-websockets-rustls = ["spacetimedb-sdk/tokio-websockets-rustls"]

[dependencies]
sea-orm = { workspace = true }
tokio = { workspace = true }
log = { workspace = true }
axum = { workspace = true }
sockudo-ws = { version = "3.1.1", default-features = false, features = ["axum-integration", "permessage-deflate", "fastrand"] }
axum-extra = { version = "0.12.6", features = ["query"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yml = { workspace = true }
toml = { workspace = true }
hyper = { workspace = true }
rayon = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
axum-codec = { workspace = true }
rand = { workspace = true }
spacetimedb-sdk = { workspace = true }
ts-rs = { workspace = true, features = ["indexmap-impl"] }
indexmap = { version = "2", features = ["serde"] }
dashmap = { version = "6.2.1", features = ["serde"] }
scc = "3.9.1"
tokio-util = { version = "0.7.19", features = ["rt"] }
futures = "0.3.34"
tower = "0.5.3"
service = { path = "../service" }
entity = { path = "../entity" }
migration = { path = "../migration" }
game_module = { path = "../game_module" }
tracing-subscriber = { version = "0.3.23", features = ["json", "serde", "serde_json"] }
tracing-appender = "0.2"
tracing = { workspace = true }
tower-http = { version = "0.7.1", features = ["fs", "cors", "compression-full"] }
tower-cookies = "0.11.0"
dotenvy = "0.15.7"
metrics = { version = "0.24.6", default-features = false }
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
nanoid = "0.5.0"
config = "0.15.27"
kanal = "0.1.1"
prometheus = "0.14.0"
metrics-process = "2.4.3"
chrono =  { workspace = true }
sea-orm-cli =  { workspace = true }
crossbeam-channel = "0.5.17"
parking_lot = "0.12.5"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
criterion = "0.8.2"
sea-orm = { workspace = true, features = ["mock"] }

[[bench]]
name = "leaderboard_get_rank"
harness = false
required-features = ["bench"]
