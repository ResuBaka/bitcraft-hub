[package]
name = "bitcraft-hub-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"

[profile.release]
debug = "line-tables-only"
opt-level = 3
lto = true

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

[workspace]
members = [".", "api", "service", "entity", "migration", "game_module"]

[workspace.dependencies]
sea-orm = { version = "2.0.0", features = [ "sqlx-postgres", "runtime-tokio-rustls", "macros", "with-time" ] }
sea-orm-cli = "2.0.0"
sea-orm-migration = "2.0.0"
serde_json = "1.0.151"
serde_yml = "0.0.13"
toml = "1.1.3"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = [ "full" ] }
log = "0.4.33"
axum = { version = "0.8.9", features = ["ws"]}
hyper = { version = "1.11.0", features = ["full"] }
rayon = "1.12.0"
anyhow = "1.0.104"
clap = { version = "4.6.4", features = ["derive"] }
axum-codec = { version = "0.0.20", features = ["serde", "json", "msgpack"] }
#spacetimedb-sdk = "1.12.0"
#spacetimedb-sdk = { path = "../../../SpacetimeDB/sdks/rust", default-features = false }
spacetimedb-sdk = { git = "https://github.com/ResuBaka/SpacetimeDB", branch = "feature/no-client-cache-feature", default-features = false }
ts-rs = "12.0.1"
tracing = "0.1.44"
chrono = "0.4.45"
rand = "0.10.2"


[dependencies]
api = { path = "api" }
tokio = { version = "1.52.3", features = [ "full" ] }

[target.'cfg(not(target_env = "msvc"))'.dependencies]
mimalloc-safe = { version = "0.1.64", features = ["v3"] }
